[tool.poetry]
name = "promptizer"
version = "0.1.0"
description = "A collaborative LLM system for prompt refinement using OpenAI and Gemini"
authors = ["Igor Olikh"]
readme = "README.md"
packages = [{include = "promptizer", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
openai = "^1.0.0"
google-generativeai = "^0.3.0"
python-dotenv = "^1.0.0"
pydantic = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

